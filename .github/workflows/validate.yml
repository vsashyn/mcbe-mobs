name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cross-checks both packs: texture paths, geometry and animation names,
      # component groups, UV nets, duplicate JSON keys. Stdlib only.
      - name: Validate packs
        run: python3 tools/validate.py

      - name: Build the .mcaddon
        run: ./build.sh --no-bump

      - uses: actions/upload-artifact@v4
        with:
          name: mcaddon
          path: dist/*.mcaddon
